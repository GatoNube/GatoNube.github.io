<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Je0on 的项目页</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
    background: linear-gradient(160deg, #0f172a 0%, #1e293b 55%, #334155 100%);
    color: #e2e8f0; padding: 24px;
  }
  .card {
    width: 100%; max-width: 640px; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12); border-radius: 18px;
    padding: 40px 36px; backdrop-filter: blur(12px);
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: .5px; }
  .sub { color: #94a3b8; font-size: 14px; margin-bottom: 26px; }
  .badge {
    display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px;
    background: rgba(34,197,94,.16); color: #4ade80; border: 1px solid rgba(34,197,94,.35);
    margin-bottom: 18px;
  }
  ul { line-height: 1.9; padding-left: 20px; margin: 0 0 22px; }
  code {
    background: rgba(148,163,184,.18); padding: 2px 7px; border-radius: 6px;
    font-family: ui-monospace, Consolas, monospace; font-size: 13px;
  }
  .foot { border-top: 1px solid rgba(255,255,255,.1); padding-top: 16px; font-size: 13px; color: #94a3b8; }
  a { color: #7dd3fc; }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">GitHub Pages · 已上线</span>
    <h1>Je0on 的项目页</h1>
    <div class="sub">由 <code>index.html</code> 提供 · 托管于 GitHub Pages</div>

    <ul>
      <li>这是项目的首页,直接编辑仓库里的 <code>index.html</code> 即可更新</li>
      <li>推送后约 1 分钟自动重新发布,浏览器强刷 <code>Ctrl + F5</code> 可见</li>
      <li>可继续新增 <code>about.html</code>、<code>style.css</code> 等任意静态文件</li>
      <li>也可放入 <code>.md</code> 文件,GitHub 会用 Jekyll 自动渲染成网页</li>
    </ul>

    <div class="foot">
      修改此文件后:<code>git add -A &amp;&amp; git commit -m "update" &amp;&amp; git push</code>
    </div>
  </main>
</body>
</html>
