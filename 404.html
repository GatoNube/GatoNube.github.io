<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · 页面不存在</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
<style>
  :root {
    --bg: #ffffff; --surface: #ffffff; --border: #e6e8ec;
    --text: #0f172a; --muted: #64748b;
    --accent: #4f46e5; --accent-2: #06b6d4;
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1020; --surface: #141c30; --border: #243149;
      --text: #e8ecf4; --muted: #93a1b8;
      --accent: #818cf8; --accent-2: #22d3ee;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
    line-height: 1.7;
  }
  .box {
    max-width: 520px; width: 100%; text-align: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; padding: 46px 34px; box-shadow: var(--shadow);
  }
  .code {
    font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: -2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 { font-size: 20px; margin: 14px 0 8px; }
  p { color: var(--muted); font-size: 15px; margin: 0 0 26px; }
  a.btn {
    display: inline-block; padding: 11px 22px; border-radius: 11px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #fff; font-size: 14.5px; font-weight: 600; text-decoration: none;
    box-shadow: var(--shadow); transition: .18s;
  }
  a.btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>页面不存在</h1>
    <p>你要找的地址可能已被移动或删除。</p>
    <a class="btn" href="/">← 返回首页</a>
  </div>
</body>
</html>
